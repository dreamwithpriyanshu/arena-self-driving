services:
  - type: web
    name: arena-self-driving
    runtime: python
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    disk:
      name: arena-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ARENA_STORAGE_DIR
        value: /var/data
