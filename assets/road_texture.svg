<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
    <!-- Base asphalt -->
    <rect width="400" height="400" fill="#1E1E24" />
    
    <!-- Left solid boundary line -->
    <rect x="10" y="0" width="8" height="400" fill="#FFFFFF" opacity="0.9" />
    
    <!-- Dashed lane marker 1 -->
    <path d="M 137 0 L 137 400" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="20 40" opacity="0.6" />
    
    <!-- Dashed lane marker 2 -->
    <path d="M 263 0 L 263 400" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="20 40" opacity="0.6" />
    
    <!-- Right solid boundary line -->
    <rect x="382" y="0" width="8" height="400" fill="#FFFFFF" opacity="0.9" />
</svg>
