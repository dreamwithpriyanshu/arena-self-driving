<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200">
    <!-- Base shadow -->
    <rect x="25" y="15" width="50" height="170" rx="15" fill="#000000" opacity="0.3" />
    
    <!-- Car body (Neutral Gray for NPC) -->
    <rect x="20" y="10" width="60" height="180" rx="15" fill="#757575" />
    
    <!-- Roof -->
    <rect x="25" y="50" width="50" height="100" rx="10" fill="#616161" />
    
    <!-- Windshield -->
    <path d="M 30 55 L 70 55 L 75 75 L 25 75 Z" fill="#1A1A24" />
    
    <!-- Rear window -->
    <path d="M 30 145 L 70 145 L 75 125 L 25 125 Z" fill="#1A1A24" />
    
    <!-- Headlights -->
    <rect x="25" y="12" width="12" height="6" rx="3" fill="#E0E0E0" opacity="0.7"/>
    <rect x="63" y="12" width="12" height="6" rx="3" fill="#E0E0E0" opacity="0.7"/>
    
    <!-- Taillights -->
    <rect x="25" y="182" width="15" height="5" rx="2" fill="#B71C1C" opacity="0.8"/>
    <rect x="60" y="182" width="15" height="5" rx="2" fill="#B71C1C" opacity="0.8"/>
</svg>
