# =============================================================================
# Self-Driving Car Simulation — Default Environment Configuration
# =============================================================================
# All HighwayEnv parameters live here so nothing is hard-coded in Python.
# Override per-session by passing a dict to highway_factory.create_highway_env().

# --- Road & traffic ---
lanes_count: 4                # number of highway lanes
vehicles_count: 20            # NPC vehicles on the road
vehicles_density: 1.5         # multiplier (increase for dense-traffic days)
ego_spacing: 1.5              # Space between ego and NPCs (allows cars to spawn behind)
initial_lane_id: null         # null → random starting lane

# --- Observation ---
observation:
  type: "Kinematics"
  vehicles_count: 6           # ego + 5 nearest neighbours
  features:
    - "x"
    - "y"
    - "vx"
    - "vy"
    - "cos_h"
    - "sin_h"
  absolute: false             # positions relative to ego vehicle
  normalize: true             # normalize features to [0, 1]

# --- Action ---
action:
  type: "DiscreteMetaAction"
  # Actions: 0=LANE_LEFT, 1=IDLE, 2=LANE_RIGHT, 3=FASTER, 4=SLOWER

# --- Reward ---
reward:
  collision_reward: -1.0      # large penalty on crash
  right_lane_reward: 0.1      # small bonus for rightmost lane
  high_speed_reward: 0.4      # reward for going fast
  lane_change_reward: 0.0     # no reward/penalty for lane changes
  reward_speed_range:
    - 20                      # min speed for partial reward
    - 30                      # max speed for full reward

# --- Simulation timing ---
simulation_frequency: 15      # physics steps per second
policy_frequency: 1           # agent decisions per second (1 action = 1 full second)
duration: 120                 # max episode length (seconds)

# --- Rendering ---
screen_width: 600
screen_height: 300
render_mode: "rgb_array"      # "rgb_array" for headless, "human" for window

# --- State discretisation (SARSA) ---
# Bin boundaries for converting continuous features into categorical states.
# See src/envs/state_builder.py for how these are applied.
sarsa_bins:
  speed_bins: [0.33, 0.66]                # slow | normal | fast  (normalised)
  front_gap_bins: [0.2, 0.5]              # close | medium | far  (normalised)
  front_speed_diff_bins: [-0.1, 0.1]      # slower | same | faster
  rear_gap_bins: [0.3]                    # close | safe (normalised)
